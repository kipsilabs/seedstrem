# seedstrem configuration. Every key can be overridden with a
# SEEDSTREM_* environment variable (e.g. SEEDSTREM_QBITTORRENT_URL).
server:
  listen: ":8080"
  # Base URL used to build the Stremio manifest and stream links handed
  # to players. Must be reachable from wherever you run Stremio.
  external_url: "http://localhost:8080"
  # Web UI login password. Generated and logged on first run if empty.
  admin_password: ""

downloader:
  # Which download client seedstrem drives: "qbittorrent" (default) or
  # "deluge". Only the matching section below is used.
  type: "qbittorrent"

  # Bring torrents you added directly in the download client under
  # seedstrem's management when they carry the label/category configured
  # below (qbittorrent.category / deluge.label). Adopted torrents are
  # streamable and are swept by the cleanup rules like any other, so
  # labelling a torrent also arms its seed-time deletion. Removing the
  # label un-adopts it, leaving the torrent itself alone. Deluge needs
  # the Label plugin.
  adopt_labelled: false

qbittorrent:
  # seedstrem talks to qBittorrent's WebUI API — the WebUI must be
  # enabled and reachable at this URL.
  url: "http://qbittorrent:8080"
  username: "admin"
  # The linuxserver image logs a temporary random password on first
  # start; set a permanent one in the qBittorrent WebUI (Tools → Options
  # → Web UI) and put it here.
  password: ""
  # Category applied to the torrents seedstrem adds, so they are
  # distinguishable from other torrents on a shared qBittorrent instance.
  category: "seedstrem"

deluge:
  # Used when downloader.type is "deluge". seedstrem talks to the Deluge
  # 2 daemon's native RPC port (not the web UI). Enable "Allow Remote
  # Connections" in the daemon settings and use an account from Deluge's
  # auth file. For fast seeking, install the bundled Seedstream plugin
  # (see contrib/deluge-seedstream/).
  host: "deluge"
  port: 58846
  username: "localclient"
  password: ""
  # Label applied to the torrents seedstrem adds (requires Deluge's
  # Label plugin; skipped when the plugin is disabled).
  label: "seedstrem"

prowlarr:
  # Torrent search backend. Leave url empty to configure later in the
  # web UI. Add indexers inside Prowlarr itself.
  url: "http://prowlarr:9696"
  api_key: ""
  # Newznab category ids searched per content type.
  movie_categories: [2000]
  tv_categories: [5000]
  anime_categories: [5070]
  # Restrict searches to specific Prowlarr indexer ids. Empty = search
  # every enabled indexer.
  indexer_ids: []
  # Global budget for a discovery search. Prowlarr is queried one indexer
  # per request concurrently; when this elapses, indexers still in flight
  # are abandoned and whatever already came back is used. This works around
  # Prowlarr having no request-level search timeout — a single slow indexer
  # would otherwise stall the whole response. 0 disables (wait for every
  # indexer). Override with PROWLARR_SEARCH_TIMEOUT.
  search_timeout: 15s
  # How long Stremio discovery search results are served from memory before
  # Prowlarr is queried again for the same search. Repeated/concurrent
  # requests for the same title within this window skip Prowlarr entirely.
  # 0 disables caching (every request searches live). Override with
  # PROWLARR_SEARCH_CACHE_TTL.
  search_cache_ttl: 5m

addon:
  # Which content types the Stremio addon serves.
  enable_movies: true
  enable_series: true
  enable_anime: false

filters:
  # Drop/rank Prowlarr results before offering them as streams.
  min_seeders: 1
  min_size_mb: 0
  max_size_mb: 0 # 0 = unbounded
  max_results: 20

meta:
  # Cinemeta provides titles/years for IMDB ids.
  cinemeta_url: "https://v3-cinemeta.strem.io"
  # How long resolve-on-play waits for qBittorrent to fetch torrent
  # metadata before answering 503 (players retry).
  metadata_timeout: 60s
  # Optional. Get a free key at https://www.themoviedb.org/settings/api.
  # Lets seedstrem resolve IMDb ids to TMDb ids for indexers that support
  # TmdbId search but not ImdbId; without it, those indexers fall back to
  # free-text search.
  tmdb_api_key: ""

paths:
  # Translate qBittorrent's paths to paths seedstrem can read.
  # With the bundled docker-compose both containers share one host
  # directory: qBittorrent mounts it at /downloads, seedstrem at /data.
  mappings:
    - remote: "/downloads"
      local: "/data"

storage:
  database: "/config/seedstrem.db"
  # Also delete the payload files when a torrent is removed via the API.
  delete_files_on_remove: true
  # Stop offering NEW streams once the download disk is at least this
  # percent full, and filter out new releases whose size would push usage
  # past it. Already-downloaded and currently-downloading content is never
  # affected. Usage is measured on the first paths.mappings local root.
  # 0 disables the gate.
  max_disk_usage_percent: 0
  # Absolute cap, in GB, on used download storage above which the RSS
  # grabber stops adding new torrents (e.g. 3072 for a 3 TB cap).
  # Complements max_disk_usage_percent; the more restrictive gate wins.
  # 0 disables the cap. On-demand streams are never blocked by this.
  max_download_storage_gb: 0

stream:
  # How long a stream request waits for missing pieces before answering
  # 503 (players retry). Also the per-read wait budget mid-stream.
  wait_timeout: 60s
  # Max bytes waited-for/read per read cycle.
  read_chunk: 4194304

cleanup:
  # How long a completed torrent may seed before it is removed.
  # 0 disables seed-time cleanup.
  seed_time: 72h
  # Download fraction (0..1) a torrent must reach to survive an
  # abandoned/canceled playback session.
  min_progress_for_cancel: 0.05
  # Seeding ratio at or above which a completed torrent becomes
  # removal-eligible, OR-ed with seed_time (either one makes it eligible).
  # 0 disables the ratio trigger.
  target_ratio: 0
  # Order in which eligible torrents are removed when cleaning up:
  # oldest_first (by add time) or lowest_upload (least bytes uploaded).
  delete_policy: oldest_first
  # How long removed torrents stay in History, along with their saved
  # .torrent files, so they can be re-added (e.g. after a tracker rule
  # change). Older entries and files are deleted automatically.
  history_retention: 720h
  # Per-indexer overrides of seed_time, for trackers with their own
  # minimum seed time. Names must match the Prowlarr indexer
  # (case-insensitive); anything not listed uses seed_time above, as do
  # torrents whose indexer is unknown (added before this setting existed,
  # or added outside a Prowlarr search). 0 means never remove that
  # indexer's torrents on seed time.
  # indexer_seed_times:
  #   TorrentLeech: 240h
  #   Nyaa: 12h

seeding:
  # Download the whole torrent (played file first, the rest afterwards) so
  # a complete copy is available to seed — better for ratio on private
  # trackers. Set false to download only the played file (less disk, but
  # you seed only that file).
  full: true

rss:
  # Background grabber: periodically pull the just-released items from your
  # Prowlarr indexers and auto-download a filtered subset. Purpose is to
  # build seeding ratio (fresh, well-seeded, optionally freeleech releases)
  # and to warm a cache so content already downloaded shows up first as a
  # "ready" stream when Stremio requests it. Off by default: this adds
  # downloads without a play action, unlike the rest of seedstrem.
  # Indexer scope reuses prowlarr.indexer_ids. The seeder floor is inherited
  # from filters.min_seeders (a ratio-safety default); size, categories, and
  # title keywords are configured independently under rss.filters below.
  # Grabbing is bounded by storage.max_disk_usage_percent and the seed-time
  # cleanup, which removes grabbed torrents once they have seeded past
  # cleanup.seed_time.
  enabled: false
  # How often to poll Prowlarr (applied at startup; a change needs a restart).
  interval: 15m
  # Max new releases added per poll, to bound the firehose. 0 disables grabbing.
  # Grabs are spread across your indexers each cycle (round-robin) so no
  # single tracker dominates.
  max_grabs_per_cycle: 5
  # Skip a grab cycle when at least this many torrents are already actively
  # downloading (progress < 1). 0 disables the gate.
  max_concurrent_downloads: 0
  # Skip a grab cycle once the store holds at least this many torrents.
  # 0 disables the gate.
  max_active_torrents: 0
  # Only grab freeleech releases (their download doesn't count against ratio).
  freeleech_only: false
  # RSS-specific filters, independent of the global filters.* used by
  # on-demand stream search. All are optional; a zero/empty value disables
  # that constraint (grab-everything).
  filters:
    # Release size bounds in MB. 0 min = no lower bound; 0 max = unbounded.
    min_size_mb: 0
    max_size_mb: 0
    # Raw newznab category ids to poll. Empty = all content types enabled
    # under addon.* (movies/tv/anime), i.e. the default behavior.
    categories: []
    # Keep only releases whose title contains at least one of these
    # (case-insensitive substring). Empty = allow all titles.
    include_keywords: []
    # Drop releases whose title contains any of these (case-insensitive).
    # Takes precedence over include_keywords.
    exclude_keywords: []

log:
  level: "info" # debug | info | warn | error
